<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Syncfusion JavaScript Document Editor - Side by Side Comparison</title>
    <!-- EJ2 Document Editor dependent theme -->
    <link href="https://cdn.syncfusion.com/ej2/35.1.40/ej2-base/styles/tailwind3.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.syncfusion.com/ej2/35.1.40/ej2-buttons/styles/tailwind3.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.syncfusion.com/ej2/35.1.40/ej2-inputs/styles/tailwind3.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.syncfusion.com/ej2/35.1.40/ej2-popups/styles/tailwind3.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.syncfusion.com/ej2/35.1.40/ej2-lists/styles/tailwind3.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.syncfusion.com/ej2/35.1.40/ej2-navigations/styles/tailwind3.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.syncfusion.com/ej2/35.1.40/ej2-splitbuttons/styles/tailwind3.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.syncfusion.com/ej2/35.1.40/ej2-dropdowns/styles/tailwind3.css" rel="stylesheet" type="text/css" />
    <!-- EJ2 Document Editor theme -->
    <link href="https://cdn.syncfusion.com/ej2/35.1.40/ej2-documenteditor/styles/tailwind3.css" rel="stylesheet" type="text/css" />
    <!-- EJ2 Document Editor dependent scripts -->
    <script src="https://cdn.syncfusion.com/ej2/35.1.40/ej2-base/dist/global/ej2-base.min.js" type="text/javascript"></script>
    <script src="https://cdn.syncfusion.com/ej2/35.1.40/ej2-data/dist/global/ej2-data.min.js" type="text/javascript"></script>
    <script src="https://cdn.syncfusion.com/ej2/35.1.40/ej2-svg-base/dist/global/ej2-svg-base.min.js" type="text/javascript"></script>
    <script src="https://cdn.syncfusion.com/ej2/35.1.40/ej2-file-utils/dist/global/ej2-file-utils.min.js" type="text/javascript"></script>
    <script src="https://cdn.syncfusion.com/ej2/35.1.40/ej2-compression/dist/global/ej2-compression.min.js" type="text/javascript"></script>
    <script src="https://cdn.syncfusion.com/ej2/35.1.40/ej2-pdf-export/dist/global/ej2-pdf-export.min.js" type="text/javascript"></script>
    <script src="https://cdn.syncfusion.com/ej2/35.1.40/ej2-buttons/dist/global/ej2-buttons.min.js" type="text/javascript"></script>
    <script src="https://cdn.syncfusion.com/ej2/35.1.40/ej2-popups/dist/global/ej2-popups.min.js" type="text/javascript"></script>
    <script src="https://cdn.syncfusion.com/ej2/35.1.40/ej2-splitbuttons/dist/global/ej2-splitbuttons.min.js" type="text/javascript"></script>
    <script src="https://cdn.syncfusion.com/ej2/35.1.40/ej2-inputs/dist/global/ej2-inputs.min.js" type="text/javascript"></script>
    <script src="https://cdn.syncfusion.com/ej2/35.1.40/ej2-lists/dist/global/ej2-lists.min.js" type="text/javascript"></script>
    <script src="https://cdn.syncfusion.com/ej2/35.1.40/ej2-navigations/dist/global/ej2-navigations.min.js" type="text/javascript"></script>
    <script src="https://cdn.syncfusion.com/ej2/35.1.40/ej2-dropdowns/dist/global/ej2-dropdowns.min.js" type="text/javascript"></script>
    <script src="https://cdn.syncfusion.com/ej2/35.1.40/ej2-calendars/dist/global/ej2-calendars.min.js" type="text/javascript"></script>
    <script src="https://cdn.syncfusion.com/ej2/35.1.40/ej2-charts/dist/global/ej2-charts.min.js" type="text/javascript"></script>
    <script src="https://cdn.syncfusion.com/ej2/35.1.40/ej2-office-chart/dist/global/ej2-office-chart.min.js" type="text/javascript"></script>
    <!-- EJ2 Document Editor script -->
    <script src="https://cdn.syncfusion.com/ej2/35.1.40/ej2-documenteditor/dist/global/ej2-documenteditor.min.js" type="text/javascript"></script>
</head>
<body>
    <!-- Controls container -->
    <div style="max-width: 760px; margin: 10px auto; padding: 0 10px;">
        <!-- Files row -->
        <div style="display: flex; gap: 6px;">
            <!-- Original file section -->
            <div style="width: 360px; border-radius: 6px; padding: 14px; border: 1px dashed #ccc;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span>Original document</span>
                    <label style="padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer;">
                        Choose file
                        <input type="file" style="display: none;" id="originalFileInput" accept=".docx,.sfdt" />
                    </label>
                </div>
                <!-- Filename + Delete icon -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 12px; color: #666;">
                    <span id="originalFileName">Supported formats: SFDT, DOCX</span>
                    <span id="removeOriginalFile" class="e-icons e-trash" style="cursor: pointer;" title="Remove file"></span>
                </div>
            </div>
            <!-- Revised file section -->
            <div style="width: 360px; border-radius: 6px; padding: 14px; border: 1px dashed #ccc;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span>Revised document</span>
                    <label style="padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer;">
                        Choose file
                        <input type="file" style="display: none;" id="revisedFileInput" accept=".docx,.sfdt" />
                    </label>
                </div>
                <!-- Filename + Delete icon -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 12px; color: #666;">
                    <span id="revisedFileName">Supported formats: SFDT, DOCX</span>
                    <span id="removeRevisedFile" class="e-icons e-trash" style="cursor: pointer;" title="Remove file"></span>
                </div>
            </div>
        </div>
        <!-- Checkbox, Compare & Download buttons -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px;">
            <div>
                <label>
                    <input type="checkbox" id="showResultCheckbox" checked="true" />
                    Show comparison results with tracked changes
                </label>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="e-primary" id="compareButton">Compare</button>
                <button class="e-outline e-flat e-primary" id="downloadButton">Download Result Document</button>
            </div>
        </div>
    </div>

    <!-- Editors Area -->
    <div style="display: flex; gap: 6px; height: calc(100vh - 160px); padding: 0px 10px;">
        <!-- Left Editor -->
        <div style="width: 50%; display: flex; flex-direction: column; border: 1px solid #ddd; overflow: hidden;">
            <div style="padding: 8px; font-weight: 600;" class="e-de-ctn-title">Original Document</div>
            <div style="flex: 1; height: 100%;">
                <div id="editorContainer1"></div>
            </div>
        </div>
        <!-- Right Editor -->
        <div style="width: 50%; display: flex; flex-direction: column; border: 1px solid #ddd; overflow: hidden;">
            <div class="e-de-ctn-title" style="display: flex; justify-content: space-between; align-items: center;">
                <div style="float: left; padding: 8px; font-weight: 600; flex: 1px;" id="rightEditorTitle">
                    Result Document (with tracked changes)
                </div>
                <button id="showRevisionsButton"
                        class="e-de-ctn-title"
                        iconCss="e-icons e-eye"
                        style="float: right; font-weight: 400; background: transparent; box-shadow: none; border-color: transparent; border-radius: 0px;
                                color: inherit; font-size: 12px;"
                        title="Show/Hide Revisions Pane">
                    Show Review Pane
                </button>
            </div>
            <div style="flex: 1; height: 100%;">
                <div id="editorContainer2"></div>
            </div>
        </div>
    </div>

    <!-- Waiting Popup Overlay -->
    <div class="overlay" id="popup-overlay"></div>
    <div id="waiting-popup" style="display: none;">
        <svg class="circular" height="40" width="40">
            <circle class="circle-path" cx="25" cy="25" r="20" fill="none" stroke-width="6" stroke-miterlimit="10" />
        </svg>
    </div>

    <style>
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(56, 56, 56, 0.5);
            z-index: 9999;
            display: none;
            cursor: not-allowed;
        }

        #waiting-popup {
            width: 56px;
            height: 56px;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            padding: 3px;
            background: white;
            box-shadow: 0px 3px 6px rgba(0, 0, 0, .3);
            z-index: 10000;
            display: none;
        }

        .circular {
            animation: rotate 2s linear infinite;
            height: 50px;
            width: 50px;
            border-radius: 50%;
        }

        .circle-path {
            stroke-dasharray: 1, 200;
            stroke-dashoffset: 0;
            animation: dash 1.5s ease-in-out infinite, color 6s ease-in-out infinite;
            stroke-linecap: round;
            stroke: #ff4081;
        }

        @keyframes rotate {
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes dash {
            0% {
                stroke-dasharray: 1, 200;
                stroke-dashoffset: 0;
            }

            50% {
                stroke-dasharray: 89, 200;
                stroke-dashoffset: -35;
            }

            100% {
                stroke-dasharray: 89, 200;
                stroke-dashoffset: -124;
            }
        }
    </style>

    <!-- Default documents and sample logic -->
    <script src="data.js" type="text/javascript"></script>
    <script src="index.js" type="text/javascript"></script>
</body>
</html>
